name: Build Kernel 4.14 (Vanilla / ReSuKISU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Target Defconfig File Name'
        required: true
        default: 'camellian_gl_defconfig'
      build_type:
        description: 'Pilih Tipe Build Kernel'
        required: true
        type: choice
        default: 'ReSuKISU'
        options:
          - Vanilla
          - ReSuKISU
      include_susfs:
        description: 'Gunakan SUSFS (Hanya Berlaku jika memilih ReSuKISU)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Build Name & ZIP
        id: set_name
        run: |
          if [ "${{ inputs.build_type }}" == "ReSuKISU" ]; then
            if [ "${{ inputs.include_susfs }}" == "true" ]; then
              echo "ZIP_NAME=ReSuKISU-SUSFS-Kernel-4.14-Camellia.zip" >> $GITHUB_ENV
              echo "BUILD_TITLE=ReSuKISU + SUSFS" >> $GITHUB_ENV
            else
              echo "ZIP_NAME=ReSuKISU-Kernel-4.14-Camellia.zip" >> $GITHUB_ENV
              echo "BUILD_TITLE=ReSuKISU" >> $GITHUB_ENV
            fi
          else
            echo "ZIP_NAME=Vanilla-Kernel-4.14-Camellia.zip" >> $GITHUB_ENV
            echo "BUILD_TITLE=Vanilla Kernel" >> $GITHUB_ENV
          fi

      - name: Send Telegram Build Started
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 **BUILD KERNEL DIMULAI!**
            🔹 Tipe: ${{ env.BUILD_TITLE }}
            🔹 Defconfig: ${{ inputs.defconfig }}
            🔹 Run Number: ${{ github.run_number }}
            Mohon tunggu...

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git wget curl zip dos2unix

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/rwxrx-rx/kernel_xiaomi_mt6833.git -b lineage-23.2-ksu kernel-source

      - name: Setup ReSuKISU & SUSFS
        if: inputs.build_type == 'ReSuKISU'
        run: |
          cd kernel-source
          
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          ln -sf ../KernelSU/kernel drivers/KernelSU
          
          if ! grep -q "KernelSU" drivers/Makefile; then
            echo "obj-y += KernelSU/" >> drivers/Makefile
          fi
          
          cat <<EOF >> arch/arm64/configs/${{ inputs.defconfig }}
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          EOF
          
          if [ "${{ inputs.include_susfs }}" == "true" ]; then
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
            cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
            cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
            cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true
            cp ../susfs4ksu/kernel_patches/fs/sus_su.c fs/ 2>/dev/null || true
            
            patch -p1 < ../susfs4ksu/kernel_patches/50_recipe_for_4.14.patch || true
            
            cd KernelSU
            patch -p1 < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
            cd ..
            
            cat <<EOF >> arch/arm64/configs/${{ inputs.defconfig }}
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          fi

      - name: Download Proton-Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git .

      - name: Setup GCC Toolchain
        run: |
          cd toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Compile Kernel
        run: |
          cd kernel-source
          
          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="root"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld
          export HOSTAR=/usr/bin/ar
          
          make O=out ARCH=arm64 ${{ inputs.defconfig }}
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git anykernel/README.md
          
          cat << 'EOF' > anykernel/anykernel.sh
          properties() { '
          kernel.string=Custom Kernel 4.14 Camellia
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }
          
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }
          
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          
          if [ -f "kernel-source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f "kernel-source/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz anykernel/
          else
            cp kernel-source/out/arch/arm64/boot/Image anykernel/
          fi
          
          cd anykernel
          zip -r9 ../${{ env.ZIP_NAME }} *

      - name: Generate Changelog
        id: changelog
        run: |
          cd kernel-source
          git log -5 --pretty=format:"- %s (%an)" > ../changelog.txt
          echo "" >> ../changelog.txt 
          
          cd ..
          {
            echo "GENERATED_CHANGELOG<<EOF"
            echo "🔹 **Build Type:** ${{ env.BUILD_TITLE }}"
            echo "🔹 **Kernel Version:** 4.14.357"
            echo "🔹 **Toolchain:** Proton-Clang"
            echo "🔹 **Latest Commits:**"
            cat changelog.txt
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v4.14-${{ inputs.build_type }}-${{ github.run_number }}
          name: "${{ env.BUILD_TITLE }} Kernel 4.14 Build #${{ github.run_number }}"
          body: ${{ env.GENERATED_CHANGELOG }}
          files: ${{ env.ZIP_NAME }}

      - name: Send Telegram Build Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          document: "${{ env.ZIP_NAME }}"
          caption: |
            ✅ **BUILD KERNEL BERHASIL!**
            
            ${{ env.GENERATED_CHANGELOG }}

      - name: Send Telegram Build Failed
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ **BUILD KERNEL GAGAL!**
            Tipe Build: ${{ env.BUILD_TITLE }}
            Silakan cek log GitHub Actions.
